<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InboxChat AI</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #181818;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 16px;
    }
    #chat {
      min-height: 300px;
      padding: 15px;
      background: #181818;
      border-radius: 12px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #16a085;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>InboxChat AI</header>
  <main>
    <div id="chat">Welcome to InboxChat AI! 👋

Your AI assistant is ready for setup.</div>
    <input id="message" placeholder="Message InboxChat AI...">
    <button onclick="sendMessage()">Send</button>
  </main>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const message = input.value.trim();

      if (!message) return;

      chat.textContent += "\n\nYou: " + message +
        "\n\nInboxChat AI: Backend connection pending.";

      input.value = "";
    }
  </script>
</body>
</html>
